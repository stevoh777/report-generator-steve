<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Results System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f5c4d">
<style>
:root{--bg:#f1f5f4;--ink:#16231f;--mut:#5d6e68;--g:#0f5c4d;--g2:#dcece8;--au:#d99a00;--ln:#d5dfdc;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--g);color:#fff;padding:16px 24px;border-bottom:4px solid var(--au)}
header h1{margin:0;font:700 22px Georgia,serif}header p{margin:2px 0 0;opacity:.85}
nav{display:flex;gap:2px;flex-wrap:wrap;padding:8px 24px 0;background:#fff;border-bottom:1px solid var(--ln)}
nav button{border:0;background:none;padding:10px 16px;font:600 14px inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--g)}
main{padding:20px 24px;max-width:1300px;margin:auto}
.box{background:#fff;border:1px solid var(--ln);padding:16px;margin-bottom:16px;border-radius:6px}
h2{font:700 18px Georgia,serif;margin:0 0 10px}h3{margin:14px 0 6px;font-size:15px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-weight:600;font-size:12px;color:var(--mut);gap:3px}
select,input,textarea,button.b{font:inherit;padding:7px 9px;border:1px solid var(--ln);border-radius:4px;background:#fff}
textarea{width:100%;min-height:90px}
button.b{background:var(--g);color:#fff;border:0;cursor:pointer;font-weight:600}
button.b.x{background:#fff;color:var(--red);border:1px solid var(--ln)}
button.b.o{background:#fff;color:var(--g);border:1px solid var(--g)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--ln);padding:5px 7px;text-align:center;white-space:nowrap}
th{background:var(--g2);font-size:12px}td.l,th.l{text-align:left}
tr.t td{background:#f7faf9;font-weight:700}
td input{width:62px;text-align:center;padding:4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.k{background:#fff;border:1px solid var(--ln);border-left:5px solid var(--au);padding:10px 14px;border-radius:6px}
.k b{display:block;font:700 24px Georgia,serif;color:var(--g)}.k span{color:var(--mut);font-size:12px}
.r{display:grid;grid-template-columns:170px 1fr 50px;gap:8px;align-items:center;margin:3px 0}
.r i{display:block;height:14px;background:var(--g);border-radius:2px}.r.w i{background:var(--red)}
.up{color:var(--g)}.dn{color:var(--red)}.mut{color:var(--mut)}
.EE1,.EE2{color:#0a6b3a;font-weight:700}.ME1,.ME2{color:#1d4ed8;font-weight:700}.AE1,.AE2{color:#b45309;font-weight:700}.BE1,.BE2{color:var(--red);font-weight:700}
.pr{display:none}
@media print{header,nav,.np{display:none}main{padding:0}.box{border:0}.pr{display:block}}
</style>
</head>
<body>
<header><h1 id="hn"></h1><p>Term and annual results: three exams per term, nine CBC subjects</p></header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
/* ---------- DATA ---------- */
const DEF={school:'Junior School',year:new Date().getFullYear(),
subjects:['English','Kiswahili','Mathematics','Integrated Science','Social Studies','Agriculture & Nutrition','Pre-Technical Studies','Creative Arts & Sports','Religious Education'],
classes:['Grade 7','Grade 8','Grade 9'],learners:[],marks:{}};
let S=JSON.parse(localStorage.getItem('srs')||'null')||DEF;
const save=()=>localStorage.setItem('srs',JSON.stringify(S));
const $=id=>document.getElementById(id);
let V={tab:S.learners.length?'marks':'learners',c:S.classes[0],t:1,e:1,lid:null};

/* ---------- CALCULATIONS ---------- */
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((p,c)=>p+c,0)/a.length:null};
const f=x=>x==null?'–':x.toFixed(1);
const LV=[[90,'EE1'],[75,'EE2'],[58,'ME1'],[41,'ME2'],[31,'AE1'],[21,'AE2'],[11,'BE1'],[0,'BE2']];
const lvl=m=>m==null?'–':LV.find(x=>m>=x[0])[1];
const lv=m=>`<span class="${lvl(m)}">${lvl(m)}</span>`;
const rem=m=>m==null?'':m>=75?'Excellent work. Keep it up.':m>=58?'Good performance. Aim higher.':m>=41?'Fair. More effort is needed.':'Needs urgent support.';
const TL=t=>t==='Y'?'Annual Average':'Term '+t;
const ex=(l,t,e,s)=>{const m=S.marks[l.id]&&S.marks[l.id][t+'-'+e];return m&&m[s]!=null?m[s]:null};
const tSub=(l,t,s)=>t==='Y'?avg([1,2,3].map(T=>tSub(l,T,s))):avg([1,2,3].map(e=>ex(l,t,e,s)));
const tMean=(l,t)=>avg(S.subjects.map((_,s)=>tSub(l,t,s)));
const tTot=(l,t)=>{const a=S.subjects.map((_,s)=>tSub(l,t,s)).filter(x=>x!=null);return a.length?a.reduce((p,c)=>p+c,0):null};
const cls=c=>S.learners.filter(l=>l.cls===c);
const rank=(L,t)=>{const r=L.map(l=>({l,m:tMean(l,t)})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);r.forEach((x,i)=>x.pos=i&&x.m===r[i-1].m?r[i-1].pos:i+1);return r};
const cst=(c,t)=>{const L=cls(c),R=rank(L,t);return{L,R,sm:S.subjects.map((_,s)=>avg(L.map(l=>tSub(l,t,s)))),mean:avg(R.map(x=>x.m))}};
const best=a=>{const v=a.filter(x=>x!=null);return v.length?[a.indexOf(Math.max(...v)),a.indexOf(Math.min(...v))]:[-1,-1]};
const bars=(labels,vals,weak)=>labels.map((n,i)=>`<div class="r${weak===i?' w':''}"><span>${n}</span><div><i style="width:${vals[i]||0}%"></i></div><b>${f(vals[i])}</b></div>`).join('');
const dist=R=>LV.map(x=>x[1]).map(k=>[k,R.filter(r=>lvl(r.m)===k).length]).filter(x=>x[1]).map(x=>`<span class="${x[0]}">${x[0]}: ${x[1]}</span>`).join(' &nbsp; ')||'–';
const kp=(a,b)=>`<div class="k"><b>${a}</b><span>${b}</span></div>`;
const sel=(fn,cur,arr)=>`<select onchange="go('${fn}',this.value)">${arr.map(a=>`<option value="${a[0]}"${a[0]==cur?' selected':''}>${a[1]}</option>`).join('')}</select>`;
const cSel=()=>`<label>Class${sel('c',V.c,S.classes.map(c=>[c,c]))}</label>`;
const tSel=(y=1)=>`<label>Period${sel('t',V.t,[1,2,3].map(t=>[t,'Term '+t]).concat(y?[['Y','Annual Average']]:[]))}</label>`;

/* ---------- PERFORMANCE CURVES ---------- */
const eM=(l,t,e)=>avg(S.subjects.map((_,s)=>ex(l,t,e,s)));
const XL=[];[1,2,3].forEach(t=>[1,2,3].forEach(e=>XL.push('T'+t+' E'+e)));
const ser=L=>XL.map((_,i)=>avg(L.map(l=>eM(l,Math.floor(i/3)+1,i%3+1))));
const COL=['#0f5c4d','#d99a00','#1d4ed8','#b42318','#7c3aed','#0891b2'];
function curve(ss){
const W=720,H=280,pl=40,pR=14,pt=18,pb=40,all=ss.flatMap(s=>s.v).filter(x=>x!=null);
if(!all.length)return '<p class="mut">No marks entered yet.</p>';
const lo=Math.max(0,Math.floor(Math.min(...all)/10)*10-10),hi=Math.min(100,Math.ceil(Math.max(...all)/10)*10+10);
const X=i=>pl+i*(W-pl-pR)/8,Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
let g='';
for(let y=lo;y<=hi;y+=10)g+=`<line x1="${pl}" x2="${W-pR}" y1="${Y(y)}" y2="${Y(y)}" stroke="#d5dfdc"/><text x="${pl-6}" y="${Y(y)+4}" text-anchor="end" font-size="11" fill="#5d6e68">${y}</text>`;
[2.5,5.5].forEach(i=>g+=`<line x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${H-pb}" stroke="#5d6e68" stroke-dasharray="4 4"/>`);
[1,4,7].forEach((i,k)=>g+=`<text x="${X(i)}" y="${H-4}" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5c4d">Term ${k+1}</text>`);
XL.forEach((n,i)=>g+=`<text x="${X(i)}" y="${H-22}" text-anchor="middle" font-size="10" fill="#5d6e68">${n}</text>`);
ss.forEach((s,k)=>{const c=COL[k%COL.length];let d='',prev=false;
s.v.forEach((v,i)=>{if(v==null){prev=false;return}d+=(prev?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);prev=true});
g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5"/>`;
s.v.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${c}"><title>${s.name}, ${XL[i]}: ${f(v)}</title></circle>`;
if(s.lab)g+=`<text x="${X(i)}" y="${Y(v)-8}" text-anchor="middle" font-size="10" fill="${c}">${f(v)}</text>`})});
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:780px;background:#fff">${g}</svg><div>${ss.map((s,k)=>`<span style="margin-right:14px"><b style="color:${COL[k%COL.length]}">●</b> ${s.name}</span>`).join('')}</div>`}
const prow=(n,a)=>{const d=a[0]!=null&&a[2]!=null?a[2]-a[0]:null;return`<tr><td class="l">${n}</td>${a.map(x=>`<td>${f(x)}</td>`).join('')}<td class="${d!=null&&d<0?'dn':'up'}">${d==null?'–':(d>=0?'▲ +':'▼ ')+d.toFixed(1)}</td></tr>`};
const phead=a=>`<tr><th class="l">${a}</th><th>Term 1</th><th>Term 2</th><th>Term 3</th><th>Annual</th><th>T1 → T3</th></tr>`;
function classPerf(c){const T=[1,2,3,'Y'].map(t=>cst(c,t));
return`<h3>Performance per term</h3><div class="sc"><table>${phead('Subject')}${S.subjects.map((n,s)=>prow(n,T.map(x=>x.sm[s]))).join('')}${prow('Class mean',T.map(x=>x.mean)).replace('<tr>','<tr class="t">')}<tr class="t"><td class="l">Level</td>${T.map(x=>`<td>${lv(x.mean)}</td>`).join('')}<td></td></tr></table></div>
<h3>Performance curve: class mean across the nine exams</h3>${curve([{name:c,v:ser(cls(c)),lab:1}])}`}
function schoolPerf(){const g=t=>avg(S.learners.map(l=>tMean(l,t)));
const rows=S.classes.map(c=>[c,[1,2,3,'Y'].map(t=>cst(c,t).mean)]).concat([['Whole school',[1,2,3,'Y'].map(g)]]);
return`<h3>Performance per term</h3><div class="sc"><table>${phead('Class')}${rows.map(r=>{const h=prow(r[0],r[1]);return r[0]==='Whole school'?h.replace('<tr>','<tr class="t">'):h}).join('')}</table></div>
<h3>Performance curve: classes and whole school across the nine exams</h3>${curve(S.classes.map(c=>({name:c,v:ser(cls(c))})).concat([{name:'Whole school',v:ser(S.learners),lab:1}]))}`}

/* ---------- VIEWS ---------- */
const views={
setup:()=>`<div class="box"><h2>School settings</h2>
<div class="bar"><label>School name<input id="sn" value="${S.school}" size="34"></label><label>Year<input id="sy" type="number" value="${S.year}" style="width:90px"></label></div>
<div class="bar" style="align-items:start"><label style="flex:1">Subjects (one per line, 9 for CBC junior school)<textarea id="ss">${S.subjects.join('\n')}</textarea></label>
<label style="flex:1">Classes (one per line)<textarea id="sc">${S.classes.join('\n')}</textarea></label></div>
<button class="b" onclick="saveSetup()">Save settings</button></div>
<div class="box"><h2>Backup</h2><p class="mut">Data is stored in this browser. Download a backup regularly.</p>
<button class="b o" onclick="expo()">Download backup</button>
<label style="display:inline-flex;margin-left:8px">Restore backup<input type="file" accept=".json" onchange="impo(this)"></label>
<button class="b x" style="margin-left:8px" onclick="if(confirm('Delete ALL data?')){localStorage.removeItem('srs');location.reload()}">Erase all data</button></div>`,

learners:()=>`<div class="box"><h2>Add learners</h2>${V.msg?`<p class="up"><b>${V.msg}</b></p>`:''}
<div class="bar">${cSel()}<label>Full name<input id="ln" size="26" placeholder="e.g. Amina Hassan" onkeydown="if(event.key==='Enter')addOne()"></label><label>Admission No<input id="la" size="10" placeholder="optional" onkeydown="if(event.key==='Enter')addOne()"></label><button class="b" onclick="addOne()">Add learner to ${V.c}</button></div>
<h3>Or add many at once</h3>
<label>One learner per line: Name, Admission No (number is optional)<textarea id="bl" placeholder="Amina Hassan, 1021&#10;Brian Otieno, 1022"></textarea></label><br>
<button class="b" onclick="addL()">Add all to ${V.c}</button></div>
<div class="box"><h2>${V.c}: ${cls(V.c).length} learners</h2><div class="sc"><table><tr><th>#</th><th class="l">Name</th><th>Adm No</th><th>Class</th><th></th></tr>
${cls(V.c).map((l,i)=>`<tr><td>${i+1}</td><td class="l">${l.name}</td><td>${l.adm||''}</td><td>${sel2(l)}</td><td><button class="b x" onclick="delL('${l.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No learners yet. Add some above.</td></tr>'}</table></div></div>`,

marks:()=>{const L=cls(V.c),k=V.t+'-'+V.e;return`<div class="box"><h2>Enter marks (out of 100)</h2>
<div class="bar">${cSel()}<label>Term${sel('t',V.t,[1,2,3].map(t=>[t,'Term '+t]))}</label><label>Exam${sel('e',V.e,[1,2,3].map(e=>[e,'Exam '+e]))}</label></div>
<p class="mut">Marks save automatically. Leave blank if the learner missed the exam.</p>
<div class="sc"><table><tr><th>#</th><th class="l">Learner</th>${S.subjects.map(s=>`<th>${s}</th>`).join('')}</tr>
${L.map((l,i)=>`<tr><td>${i+1}</td><td class="l">${l.name}</td>${S.subjects.map((_,s)=>{const m=S.marks[l.id]&&S.marks[l.id][k];return`<td><input type="number" min="0" max="100" value="${m&&m[s]!=null?m[s]:''}" oninput="setM('${l.id}',${s},this.value)"></td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${S.subjects.length+2}">No learners in ${V.c} yet. <button class="b" onclick="tab('learners')">Add learners now</button></td></tr>`}</table></div></div>`},

class:()=>{const{R,sm,mean}=cst(V.c,V.t),[b,w]=best(sm);
return`<div class="bar np">${cSel()}${tSel()}<button class="b o" onclick="print()">Print</button></div>
<div class="g">${kp(f(mean)+' '+lvl(mean),'Class mean ('+TL(V.t)+')')}${kp(R.length,'Learners with marks')}${kp(b<0?'–':S.subjects[b],'Strongest subject')}${kp(w<0?'–':S.subjects[w],'Weakest subject')}</div>
<div class="box"><h2>${S.school}: ${V.c}, ${TL(V.t)} ${S.year}</h2><div class="sc"><table><tr><th>Pos</th><th class="l">Learner</th>${S.subjects.map(s=>`<th>${s}</th>`).join('')}<th>Total</th><th>Mean</th><th>Level</th></tr>
${R.map(r=>`<tr><td>${r.pos}</td><td class="l">${r.l.name}</td>${S.subjects.map((_,s)=>`<td>${f(tSub(r.l,V.t,s))}</td>`).join('')}<td>${f(tTot(r.l,V.t))}</td><td><b>${f(r.m)}</b></td><td>${lv(r.m)}</td></tr>`).join('')||`<tr><td colspan="${S.subjects.length+5}">No marks entered yet.</td></tr>`}
<tr class="t"><td></td><td class="l">Class mean</td>${sm.map(x=>`<td>${f(x)}</td>`).join('')}<td></td><td>${f(mean)}</td><td>${lv(mean)}</td></tr></table></div></div>
<div class="box"><h2>Class analysis</h2><h3>Subject performance</h3>${bars(S.subjects,sm,w)}<h3>Performance levels</h3>${dist(R)}
<h3>Learners needing support (below 41)</h3>${R.filter(r=>r.m<41).map(r=>r.l.name+' ('+f(r.m)+')').join(', ')||'None'}
${classPerf(V.c)}</div>`},

learner:()=>{const L=cls(V.c),l=L.find(x=>x.id===V.lid)||L[0];
const bar=`<div class="bar np">${cSel()}<label>Learner${sel('lid',l?l.id:'',L.map(x=>[x.id,x.name]))}</label>${tSel(0)}<button class="b o" onclick="print()">Print report card</button></div>`;
if(!l)return bar+'<div class="box">No learners in this class.</div>';
const t=V.t==='Y'?1:V.t,cs=cst(l.cls,t).sm,pos=T=>{const r=rank(cls(l.cls),T).find(x=>x.l===l);return r?r.pos+' of '+rank(cls(l.cls),T).length:'–'};
const sm=S.subjects.map((_,s)=>tSub(l,t,s)),[b,w]=best(sm),m=tMean(l,t);
return bar+`<div class="box"><h2>${S.school}<br><span class="mut" style="font:400 14px Segoe UI">Learner report: ${TL(t)} ${S.year}</span></h2>
<p><b>${l.name}</b> &nbsp; Adm: ${l.adm||'–'} &nbsp; ${l.cls}</p>
<div class="g">${kp(f(m)+' '+lvl(m),'Term mean')}${kp(f(tTot(l,t)),'Total marks')}${kp(pos(t),'Class position')}${kp(b<0?'–':S.subjects[b],'Best subject')}</div>
<div class="sc"><table><tr><th class="l">Subject</th><th>Exam 1</th><th>Exam 2</th><th>Exam 3</th><th>Mean</th><th>Level</th><th>Class mean</th><th>Vs class</th></tr>
${S.subjects.map((n,s)=>{const d=sm[s]==null||cs[s]==null?null:sm[s]-cs[s];return`<tr><td class="l">${n}</td>${[1,2,3].map(e=>`<td>${ex(l,t,e,s)??'–'}</td>`).join('')}<td><b>${f(sm[s])}</b></td><td>${lv(sm[s])}</td><td>${f(cs[s])}</td><td class="${d>=0?'up':'dn'}">${d==null?'–':(d>=0?'+':'')+d.toFixed(1)}</td></tr>`}).join('')}</table></div>
<p><b>Remark:</b> ${rem(m)}${w>=0?' Focus on <b>'+S.subjects[w]+'</b>.':''}</p>
<p class="pr">Class teacher: ____________ &nbsp; Head teacher: ____________ &nbsp; Parent: ____________</p></div>
<div class="box"><h2>Progress across the year</h2><div class="sc"><table><tr><th class="l">Subject</th><th>Term 1</th><th>Term 2</th><th>Term 3</th><th>Annual</th><th>Level</th><th>Trend</th></tr>
${S.subjects.map((n,s)=>{const a=[1,2,3].map(T=>tSub(l,T,s)),y=tSub(l,'Y',s),v=a.filter(x=>x!=null),d=v.length>1?v[v.length-1]-v[0]:null;return`<tr><td class="l">${n}</td>${a.map(x=>`<td>${f(x)}</td>`).join('')}<td><b>${f(y)}</b></td><td>${lv(y)}</td><td class="${d>=0?'up':'dn'}">${d==null?'–':(d>=0?'▲ +':'▼ ')+d.toFixed(1)}</td></tr>`}).join('')}
<tr class="t"><td class="l">Mean</td>${[1,2,3].map(T=>`<td>${f(tMean(l,T))}</td>`).join('')}<td>${f(tMean(l,'Y'))}</td><td>${lv(tMean(l,'Y'))}</td><td></td></tr>
<tr class="t"><td class="l">Position</td>${[1,2,3].map(T=>`<td>${pos(T)}</td>`).join('')}<td>${pos('Y')}</td><td></td><td></td></tr></table></div>
<h3>Performance curve: all nine exams</h3>${curve([{name:l.name,v:XL.map((_,i)=>eM(l,Math.floor(i/3)+1,i%3+1)),lab:1},{name:'Class mean',v:ser(cls(l.cls))}])}
<h3>Subjects this term</h3>${bars(S.subjects,sm,w)}</div>`},

school:()=>{const t=V.t,all=rank(S.learners,t),cc=S.classes.map(c=>({c,...cst(c,t)})),
sm=S.subjects.map((_,s)=>avg(S.learners.map(l=>tSub(l,t,s)))),mean=avg(all.map(x=>x.m)),[b,w]=best(sm);
return`<div class="bar np">${tSel()}<button class="b o" onclick="print()">Print</button></div>
<div class="g">${kp(f(mean)+' '+lvl(mean),'School mean ('+TL(t)+')')}${kp(all.length,'Learners with marks')}${kp(b<0?'–':S.subjects[b],'Strongest subject')}${kp(w<0?'–':S.subjects[w],'Weakest subject')}</div>
<div class="box"><h2>${S.school}: ${TL(t)} ${S.year}</h2><h3>Class means by subject</h3><div class="sc"><table><tr><th class="l">Class</th><th>Learners</th>${S.subjects.map(s=>`<th>${s}</th>`).join('')}<th>Mean</th><th>Level</th></tr>
${cc.map(x=>`<tr><td class="l">${x.c}</td><td>${x.R.length}</td>${x.sm.map(v=>`<td>${f(v)}</td>`).join('')}<td><b>${f(x.mean)}</b></td><td>${lv(x.mean)}</td></tr>`).join('')}
<tr class="t"><td class="l">Whole school</td><td>${all.length}</td>${sm.map(v=>`<td>${f(v)}</td>`).join('')}<td>${f(mean)}</td><td>${lv(mean)}</td></tr></table></div></div>
<div class="box"><h2>School analysis</h2><h3>Subject performance</h3>${bars(S.subjects,sm,w)}<h3>Class performance</h3>${bars(cc.map(x=>x.c),cc.map(x=>x.mean))}
${schoolPerf()}
<h3>Performance levels</h3>${dist(all)}</div>
<div class="box"><h2>Top 10 learners</h2><div class="sc"><table><tr><th>Pos</th><th class="l">Learner</th><th>Class</th><th>Mean</th><th>Level</th></tr>
${all.slice(0,10).map((r,i)=>`<tr><td>${i+1}</td><td class="l">${r.l.name}</td><td>${r.l.cls}</td><td>${f(r.m)}</td><td>${lv(r.m)}</td></tr>`).join('')||'<tr><td colspan="5">No marks yet.</td></tr>'}</table></div></div>`}
};
const tabs=[['marks','Enter Marks'],['class','Class Results'],['learner','Learner Report'],['school','School Analysis'],['learners','Learners'],['setup','Settings']];

/* ---------- ACTIONS ---------- */
const sel2=l=>`<select onchange="mv('${l.id}',this.value)">${S.classes.map(c=>`<option${c===l.cls?' selected':''}>${c}</option>`).join('')}</select>`;
function go(k,v){V[k]=(k==='t'&&v!=='Y'||k==='e')?+v:v;if(k==='c')V.lid=null;render()}
function tab(t){V.tab=t;V.msg='';render()}
function setM(id,s,v){const k=V.t+'-'+V.e,m=(S.marks[id]=S.marks[id]||{});const a=(m[k]=m[k]||Array(S.subjects.length).fill(null));a[s]=v===''?null:Math.max(0,Math.min(100,+v));save()}
function addOne(){const n=$('ln').value.trim();if(!n)return alert("Type the learner's name first.");
S.learners.push({id:'L'+Date.now()+Math.random().toString(36).slice(2,6),name:n,adm:$('la').value.trim(),cls:V.c});save();
$('ln').value='';$('la').value='';V.msg=n+' added to '+V.c+'.';render();$('ln').focus()}
function addL(){const lines=$('bl').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return alert('Type at least one name first.');
lines.forEach(x=>{const p=x.split(',');S.learners.push({id:'L'+Date.now()+Math.random().toString(36).slice(2,6),name:p[0].trim(),adm:(p[1]||'').trim(),cls:V.c})});
save();$('bl').value='';V.msg=lines.length+' learner(s) added to '+V.c+'.';render()}
function delL(id){if(confirm('Delete this learner and their marks?')){S.learners=S.learners.filter(l=>l.id!==id);delete S.marks[id];save();render()}}
function mv(id,c){S.learners.find(l=>l.id===id).cls=c;save();render()}
function saveSetup(){S.school=$('sn').value.trim()||'Junior School';S.year=+$('sy').value;
S.subjects=$('ss').value.split('\n').map(x=>x.trim()).filter(Boolean);S.classes=$('sc').value.split('\n').map(x=>x.trim()).filter(Boolean);
if(!S.classes.includes(V.c))V.c=S.classes[0];save();render();alert('Settings saved')}
function expo(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='results-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function impo(i){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();location.reload()}catch(e){alert('That file is not a valid backup.')}};r.readAsText(i.files[0])}
function render(){$('hn').textContent=S.school+' Results System';
$('nav').innerHTML=tabs.map(t=>`<button class="${t[0]===V.tab?'on':''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('');
const K=['ln','la','bl'].map(i=>{const e=document.getElementById(i);return e?e.value:null});
$('app').innerHTML=views[V.tab]();
['ln','la','bl'].forEach((i,j)=>{const e=document.getElementById(i);if(e&&K[j])e.value=K[j]})}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
